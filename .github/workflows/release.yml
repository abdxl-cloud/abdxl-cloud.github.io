name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A2FE2D: ${{ secrets.A2FE2D }}
          B8AC6A: ${{ secrets.B8AC6A }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A2FE2D', '')
          k2 = os.environ.get('B8AC6A', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 0440e41125aae100e75edf014d240ca6f2 -->', k1) if k1 else txt
          out = out.replace('<!-- 9b62b04bb7a74f706a51cd -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
